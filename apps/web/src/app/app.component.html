<a class="skip-link" href="#conteudo-principal">Ir para o conteúdo principal</a>

<header class="shell-header">
  <div class="shell-top">
    <p class="shell-product">{{ title }}</p>
    <p class="shell-meta">v{{ implementationVersion }} · {{ statusLine }}</p>
  </div>

  <nav class="shell-nav shell-nav-primary" aria-label="Painéis oficiais">
    <p class="shell-nav-label">15 painéis</p>
    <ul class="shell-nav-list">
      @for (item of dashboardNav; track item.path) {
        <li>
          <a [routerLink]="item.path" routerLinkActive="is-active">{{ item.label }}</a>
        </li>
      }
    </ul>
  </nav>

  <nav class="shell-nav shell-nav-secondary" aria-label="Utilitários">
    <p class="shell-nav-label">Utilitários</p>
    <ul class="shell-nav-list">
      @for (item of utilityNav; track item.path) {
        <li>
          <a
            [routerLink]="item.path"
            routerLinkActive="is-active"
            [routerLinkActiveOptions]="{ exact: item.path === '/' }"
          >{{ item.label }}</a>
        </li>
      }
    </ul>
  </nav>
</header>

<main id="conteudo-principal" class="shell-main">
  <router-outlet />
</main>
