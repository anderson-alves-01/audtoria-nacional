<a class="skip-link" href="#conteudo-principal">Ir para o conteúdo principal</a>

<header class="shell-header">
  <div class="shell-brand">
    <div class="shell-brand-text">
      <p class="shell-product">{{ title }}</p>
      <p class="shell-meta">
        implementação {{ implementationVersion }} · {{ statusLine }}
      </p>
    </div>
  </div>

  <nav class="shell-nav" aria-label="Principal">
    @for (group of navGroups; track group.id) {
      <div class="shell-nav-group">
        <p class="shell-nav-label" [id]="'nav-' + group.id">{{ group.label }}</p>
        <ul class="shell-nav-list" [attr.aria-labelledby]="'nav-' + group.id">
          @for (item of group.items; track item.path) {
            <li>
              <a
                [routerLink]="item.path"
                routerLinkActive="is-active"
                [routerLinkActiveOptions]="{ exact: item.path === '/' }"
              >{{ item.label }}</a>
            </li>
          }
        </ul>
      </div>
    }
  </nav>
</header>

<main id="conteudo-principal" class="shell-main">
  <router-outlet />
</main>
