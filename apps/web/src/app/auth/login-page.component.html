<section aria-labelledby="login-title">
  <h1 id="login-title">Entrar</h1>
  <p>O administrador técnico informa o nome, a senha e o código do autenticador.</p>
  <p>A consulta pública continua sem essa senha. Nenhum acesso cria crédito.</p>
  <form (ngSubmit)="submit()">
    <label>
      Nome
      <input name="username" [(ngModel)]="username" autocomplete="username" />
    </label>
    <label>
      Senha
      <input name="password" type="password" [(ngModel)]="password" autocomplete="current-password" />
    </label>
    <label>
      Código do autenticador
      <input name="code" inputmode="numeric" autocomplete="one-time-code" [(ngModel)]="code" />
    </label>
    <button type="submit" [disabled]="submitting">Entrar</button>
  </form>
  @if (message) {
    <p role="alert">{{ message }}</p>
  }
</section>
