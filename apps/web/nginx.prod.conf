# Production nginx: static SPA only.
# API traffic (/v1, /health, /docs) is routed by the ALB to the API target group.
server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    include /etc/nginx/mime.types;

    location / {
        try_files $uri $uri/ /index.html;
    }
}
