name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: sirta
          POSTGRES_PASSWORD: sirta_local_only
          POSTGRES_DB: sirta
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sirta -d sirta"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://sirta:sirta_local_only@localhost:5432/sirta
      OIDC_JWKS_PATH: tests/fixtures/jwt/jwks.json
      OIDC_ISSUER: http://localhost:8081/realms/sirta
      OIDC_AUDIENCE: sirta-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Format
        run: python -m ruff format --check apps tests alembic
      - name: Lint
        run: python -m ruff check apps tests alembic
      - name: OpenAPI lint
        run: python -m openapi_spec_validator contracts/openapi/sirta-v1.yaml
      - name: Secret scan
        run: detect-secrets scan --baseline .secrets.baseline --exclude-files 'package-lock.json|.*\.lock'
      - name: Tests
        run: python -m pytest tests -q
      - name: Migrate
        run: alembic upgrade head

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build

  containers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build API image
        run: docker build -f apps/api/Dockerfile -t sirta-api:0.3.1 .
      - name: Build worker image
        run: docker build -f apps/workers/Dockerfile -t sirta-worker:0.3.1 .
      - name: Build web image
        run: docker build -f apps/web/Dockerfile -t sirta-web:0.3.1 .
