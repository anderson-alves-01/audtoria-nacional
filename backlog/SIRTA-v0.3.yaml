version: 0.3.2
spec_version: 0.3.0
epics:
  - id: EP-SIRTA-001
    title: Local executable baseline
    stories:
      - id: SIRTA-001
        title: Git baseline and proprietary license
        status: done
        sprint: 0
        depends_on: []
        fixtures: none
        acceptance:
          - Git initialized only after confirming no parent repository
          - .gitignore excludes .env, secrets, volumes, node_modules and IDE files
          - LICENSE is All Rights Reserved
      - id: SIRTA-002
        title: FastAPI hexagonal health workspace
        status: done
        sprint: 0
        depends_on: [SIRTA-001]
        fixtures: none
        acceptance:
          - GET /health returns spec 0.3.0 and implementation 0.3.1
      - id: SIRTA-003
        title: Local Docker Compose stack
        status: done
        sprint: 0
        depends_on: [SIRTA-002]
        fixtures: synthetic Keycloak users analyst.alpha validator.alpha admin.alpha analyst.beta
        acceptance:
          - compose.yaml defines postgres redis minio keycloak api worker web
          - no GCP/AWS endpoints
      - id: SIRTA-004
        title: Readiness tracing Alembic and CI
        status: done
        sprint: 0
        depends_on: [SIRTA-003]
        fixtures: none
        acceptance:
          - GET /ready returns 503 when the database is unreachable
          - JSON logs include trace_id
          - CI lints Python, OpenAPI, secrets, Angular and container builds
  - id: EP-SIRTA-002
    title: Tenant and authorization context
    stories:
      - id: SIRTA-010
        title: Identity persistence
        status: done
        sprint: 1
        depends_on: [SIRTA-004]
        fixtures: tests/fixtures/synthetic.py tenants alpha and beta
        acceptance:
          - Organization Tenant Territory User Role AccessPurpose persist
      - id: SIRTA-011
        title: OIDC fail-closed context
        status: done
        sprint: 1
        depends_on: [SIRTA-010]
        fixtures: tests/fixtures/jwt
        acceptance:
          - Missing bearer returns 401 RFC 9457
          - Missing or expired purpose returns 403
      - id: SIRTA-012
        title: RBAC ABAC fiscal isolation
        status: done
        sprint: 1
        depends_on: [SIRTA-011]
        fixtures: CREDIT_ALPHA CREDIT_BETA
        acceptance:
          - tech_admin cannot read tax credits
          - denied territory returns 403
          - cross-tenant GET returns 404
          - protected /v1 routes declare get_access_context
      - id: SIRTA-013
        title: Immutable audit and log redaction
        status: done
        sprint: 1
        depends_on: [SIRTA-012]
        fixtures: synthetic credits
        acceptance:
          - Listing credits emits tax_credit.list without amounts
          - Logs do not contain bearer tokens or CPF patterns
  - id: EP-SIRTA-003
    title: Tax credit validation
    stories:
      - id: SIRTA-020
        title: ValidateCredit command
        status: done
        sprint: 2
        depends_on: [SIRTA-013]
        fixtures: CREDIT_ALPHA hashed EVIDENCE_ALPHA and validator.alpha
        acceptance:
          - Validator APPROVE with complete checklist moves IDENTIFIED to VALIDATED
          - Invalid transition returns 409 without changing version
          - Idempotency-Key replays the same body
      - id: SIRTA-021
        title: Validation checklist
        status: done
        sprint: 2
        depends_on: [SIRTA-020]
        fixtures: credit-legality-v1
        acceptance:
          - Incomplete checklist on APPROVE returns 422 and leaves IDENTIFIED
      - id: SIRTA-022
        title: Evidence hashes
        status: done
        sprint: 2
        depends_on: [SIRTA-021]
        fixtures: sha256 of synthetic-alpha-evidence
        acceptance:
          - Seeded evidences persist 64-character SHA-256
          - Evidence without hash is rejected by the domain
      - id: SIRTA-023
        title: Invalid transition tests
        status: done
        sprint: 2
        depends_on: [SIRTA-022]
        fixtures: CREDIT_ALPHA CREDIT_BETA
        acceptance:
          - Analyst and credit creator receive 403
          - Cross-tenant validation returns 404
          - Collection remains 404
  - id: EP-SIRTA-004
    title: Controlled administrative collection
    status: done
    stories:
      - id: SIRTA-030
        title: StartAdministrativeCollection command
        status: done
        sprint: 3
        depends_on: [SIRTA-023]
        fixtures: collector.alpha and CREDIT_ALPHA
        acceptance:
          - IDENTIFIED credit returns 409 without collection case
          - VALIDATED ENFORCEABLE credit opens ADMINISTRATIVE case with SLA
      - id: SIRTA-031
        title: Block unvalidated or unenforceable credits
        status: done
        sprint: 3
        depends_on: [SIRTA-030]
        fixtures: SUSPENDED synthetic credit
        acceptance:
          - Suspended validated credit returns 409
      - id: SIRTA-032
        title: Collector role isolation
        status: done
        sprint: 3
        depends_on: [SIRTA-031]
        fixtures: analyst.alpha collector.alpha
        acceptance:
          - Analyst receives 403
          - Cross-tenant collection returns 404
      - id: SIRTA-033
        title: Collection timeline and UI
        status: done
        sprint: 3
        depends_on: [SIRTA-032]
        fixtures: synthetic SLA 15 days
        acceptance:
          - Case timeline contains opened event
          - Angular page shows blocked-credit conflict
  - id: EP-SIRTA-005
    title: Synthetic data pipeline and dashboard
    status: done
    stories:
      - id: SIRTA-040
        title: Synthetic ISS load manifest
        status: done
        sprint: 4
      - id: SIRTA-041
        title: Quarantine invalid rows
        status: done
        sprint: 4
      - id: SIRTA-042
        title: Idempotent replay and logical rollback
        status: done
        sprint: 4
      - id: SIRTA-043
        title: Credit funnel Gold without regional R$
        status: done
        sprint: 4
definition_of_ready:
  - acceptance_criteria_defined
  - dependencies_known
  - synthetic_fixture_available
  - security_impact_classified
  - human_gate_identified
definition_of_done:
  - tests_green
  - contracts_valid
  - authorization_negative_tests_green
  - audit_event_verified
  - documentation_updated
  - evidence_saved
  - rollback_documented
