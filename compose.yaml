# Local SIRTA stack. Synthetic data only. Do not point these services at cloud projects.

name: sirta-local

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sirta
      POSTGRES_PASSWORD: sirta_local_only
      POSTGRES_DB: sirta
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sirta -d sirta"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: sirta
      MINIO_ROOT_PASSWORD: sirta_local_only
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    depends_on:
      minio:
        condition: service_started
    entrypoint:
      - /bin/sh
      - -c
      - |
        until mc alias set local http://minio:9000 sirta sirta_local_only; do sleep 1; done
        mc mb --ignore-existing local/sirta-local
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    command:
      - start-dev
      - --import-realm
      - --http-port=8080
      - --hostname=localhost
      - --hostname-strict=false
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin_local_only
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin_local_only
    ports:
      - "8081:8080"
    volumes:
      - ./infra/keycloak/realm-sirta.json:/opt/keycloak/data/import/realm-sirta.json:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 40s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      SIRTA_ENV: local
      DATABASE_URL: postgresql+psycopg://sirta:sirta_local_only@postgres:5432/sirta
      REDIS_URL: redis://redis:6379/0
      OIDC_ISSUER: http://keycloak:8080/realms/sirta
      OIDC_AUDIENCE: sirta-api
      OIDC_JWKS_URL: http://keycloak:8080/realms/sirta/protocol/openid-connect/certs
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: sirta
      S3_SECRET_KEY: sirta_local_only
      S3_BUCKET: sirta-local
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      keycloak:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: apps/workers/Dockerfile
    environment:
      SIRTA_ENV: local
      DATABASE_URL: postgresql+psycopg://sirta:sirta_local_only@postgres:5432/sirta
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  minio_data:
