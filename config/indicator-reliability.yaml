# Registro de confiabilidade dos indicadores.
#
# Níveis
#   NAO_CONFIAVEL  não entra em cálculo fiscal, não é publicado no Simulador e não serve de referência.
#   EXPLORATORIO   pode aparecer com aviso e servir de hipótese rotulada. Não entra em cálculo fiscal.
#   CONFERIDO      reconciliado com a fonte original, definição conhecida e revisão humana registrada.
#
# Regras
#   - Indicador que não está neste arquivo é tratado como NAO_CONFIAVEL (falha fechada).
#   - CONFERIDO exige conferred_by, conferred_at e ao menos uma evidência. O carregamento rejeita o arquivo
#     sem esses campos.
#   - Nenhum script promove um indicador. A promoção é uma edição humana revisada, com evidência.
#   - Nenhum indicador está CONFERIDO nesta versão.
version: 1
indicators:
  - id: sped_quantidade_uf_cfop_ano
    label: Quantidade de NF-e por UF, CFOP e ano (2021 a 2025)
    level: NAO_CONFIAVEL
    reason: >-
      Valores incompatíveis com o porte da UF e saltos acima de 100x entre 2024 e 2025. A quantidade por UF
      e CFOP define a participação do rateio. Definição de "Quantidade NF-e" ausente nas duas fontes.
    evidence:
      - evidence/ops/sped-reconciliacao-20261028.md
      - docs/data/SPED-CONFIABILIDADE.md
    reviewed_at: 2026-10-28
  - id: sped_compras_uf
    label: Compras por UF (planilha consolidada)
    level: NAO_CONFIAVEL
    reason: >-
      1.041 pares UF x CFOP x ano (268.317.945 NF-e) classificados como Compras pela regra publicada estão
      ausentes da planilha, sem regra de exclusão que os explique. Decisão de 28/10/2026: as entradas por
      transferência confirmadas (1.151 a 1.154 e 2.151 a 2.154, 132.237.096 NF-e) não são Compras, e os códigos
      que a tabela oficial de CFOP não define (1.159, 2.159, 1.190, 2.170 e vizinhos, 136.080.849 NF-e) ficam
      pendentes de classificação. A quantidade por UF e CFOP segue sem conferência.
    evidence:
      - evidence/ops/sped-auditoria-omissoes-20261028.md
      - evidence/ops/sped-omissoes-1041-20261028.csv
    reviewed_at: 2026-10-28
  - id: sped_valor_estimado_uf_cfop_ano
    label: Valor estimado por UF, CFOP e ano (R$)
    level: NAO_CONFIAVEL
    reason: >-
      Rateio do valor nacional do CFOP pela participação da UF na quantidade. Herda o erro da quantidade
      por UF e CFOP. Não é valor declarado por contribuintes.
    evidence:
      - evidence/ops/sped-reconciliacao-20261028.md
    reviewed_at: 2026-10-28
  - id: sped_valor_estimado_operacao
    label: Valor estimado por operação (UFs somadas)
    level: NAO_CONFIAVEL
    reason: Soma de valores rateados e omissão de entradas por transferência na operação Compras.
    evidence:
      - evidence/ops/sped-reconciliacao-20261028.md
      - evidence/ops/sped-auditoria-omissoes-20261028.md
    reviewed_at: 2026-10-28
  - id: sped_transferencias_por_direcao
    label: Transferências por direção (recebidas e remetidas)
    level: NAO_CONFIAVEL
    reason: >-
      A planilha só traz saídas. As transferências recebidas (1.151 a 1.154 e 2.151 a 2.154) estão fora dela e
      só existem nos arquivos oficiais. Das transferências remetidas publicadas, 10,2% (38.882.859 NF-e) estão em
      CFOPs que a tabela oficial não lista como transferência (5.159, 5.160, 6.159, 5.192 e outros). As duas
      direções nunca são somadas, porque o mesmo movimento pode aparecer nelas e a soma duplicaria a contagem.
    evidence:
      - evidence/ops/sped-auditoria-omissoes-20261028.md
      - docs/data/SPED-CONFIABILIDADE.md
    reviewed_at: 2026-10-28
  - id: sped_quantidade_uf_ano
    label: Quantidade de NF-e por UF e ano, todos os CFOPs somados
    level: EXPLORATORIO
    reason: >-
      O total das UFs bate com o total nacional, mas a soma por UF não bate com o porte esperado. Pode
      aparecer com aviso. Não serve de base fiscal.
    evidence:
      - evidence/ops/sped-reconciliacao-20261028.md
    reviewed_at: 2026-10-28
  - id: sped_quantidade_nacional_cfop_mes
    label: Quantidade nacional de NF-e por CFOP e mês (2025)
    level: EXPLORATORIO
    reason: Definição ausente. Fecha com o histórico só no total geral, não por CFOP nem por entrada e saída.
    evidence:
      - evidence/ops/sped-reconciliacao-20261028.md
    reviewed_at: 2026-10-28
  - id: sped_valor_nacional_cfop_mes
    label: Valor nacional por CFOP e mês (R$, 2025)
    level: EXPLORATORIO
    reason: Valor declarado pela fonte, sem conferência independente.
    evidence:
      - evidence/ops/sped-reconciliacao-20261028.md
    reviewed_at: 2026-10-28
  - id: simulador_imposto_apurado_dados_publicos
    label: Imposto estimado (simulação) a partir de dados públicos no Simulador
    level: NAO_CONFIAVEL
    reason: >-
      Deriva do valor estimado por UF e CFOP, que é NAO_CONFIAVEL, e de alíquotas ainda não homologadas.
      A comparação com dados públicos fica desabilitada até existir base homologada.
    evidence:
      - docs/data/SPED-CONFIABILIDADE.md
    reviewed_at: 2026-10-28
  - id: icms_aliquota_ac
    label: Alíquota modal de ICMS do Acre (17% até 31/03/2023, 19% desde 01/04/2023)
    level: EXPLORATORIO
    reason: >-
      19% desde 01/04/2023: fonte primária LC/AC 422/2022 (legis.ac.gov.br/detalhar/5461) com as exceções do art. 18
      registradas; 17% de 01/01/2002 a 31/03/2023 com as páginas da Sefaz/AC. Não é homologada: falta a revisão
      humana (responsável e data), a lista completa de exceções (o texto publicado omite itens) e a homologação.
    evidence:
      - alembic/versions/0109_tax_rate_versions.py
      - alembic/versions/0110_direction_rate_scope.py
    reviewed_at: 2026-10-28
  - id: icms_aliquota_demais_uf
    label: Alíquota modal de ICMS das outras 26 UFs
    level: EXPLORATORIO
    reason: >-
      Percentuais lidos de uma imagem informada pelo responsável. Imagem não é fundamento legal, e por isso a
      tabela fica PENDENTE e não homologada. Cada UF precisa de lei, vigência e URL oficial.
    evidence:
      - alembic/versions/0109_tax_rate_versions.py
    reviewed_at: 2026-10-28
  - id: itcd_itbi_iss_aliquotas
    label: Parâmetros de simulação de ITCD (6%), ITBI (3%) e ISS (5%)
    level: EXPLORATORIO
    reason: >-
      Parâmetros do requisito do Simulador, sem legislação. ITCD é estadual e ITBI e ISS são municipais: uma
      alíquota única não vale para todas as UFs nem para todos os municípios e nunca será homologada como tal.
      O cadastro relaciona imposto, localidade, operação, fundamento legal e vigência. Faltam a lei estadual, as
      faixas, as bases e a vigência (ITCD), a lei do município (ITBI) e a lei do município com o item da lista
      de serviços (ISS). Limites de referência (ITCD 8%, ISS 2% a 5%) informados pelo responsável, a conferir.
    evidence:
      - alembic/versions/0109_tax_rate_versions.py
      - alembic/versions/0110_direction_rate_scope.py
    reviewed_at: 2026-10-28
