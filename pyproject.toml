[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sirta"
version = "0.3.4"
description = "SIRTA Municipal local implementation (Sprint 4 synthetic data)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "All Rights Reserved" }
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.30.6",
  "pydantic-settings>=2.4.0",
  "structlog>=24.4.0",
  "sqlalchemy>=2.0.35",
  "psycopg[binary]>=3.2.3",
  "alembic>=1.13.3",
  "redis>=5.1.0",
  "PyJWT[crypto]>=2.9.0",
  "httpx>=0.27.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "httpx>=0.27.2",
  "ruff>=0.6.8",
  "openapi-spec-validator>=0.7.1",
  "detect-secrets>=1.5.0",
  "PyYAML>=6.0.2",
]

[tool.setuptools.package-dir]
"" = "apps/api/src"

[tool.setuptools.packages.find]
where = ["apps/api/src"]

[tool.pytest.ini_options]
pythonpath = ["apps/api/src"]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["apps/api/src", "apps/workers/src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"apps/api/src/sirta_api/entrypoints/*.py" = ["B008"]
"apps/api/src/sirta_api/adapters/http/deps.py" = ["B008"]
