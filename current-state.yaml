unicipal rate is registered, ITBI and ISS stay SIMULACAO parameters. Defects proven by a failing test and fixed: float rounding of the tax to the cent, overflow and negative zero, labels that said apurado instead of estimado, a public data gate that accepted duplicate or evidence-free copies, a future conferred_at, and missing audit events on reading rates and on a refused fiscal use. Migration 0111_tax_rate_review_fields adds restrictions, reviewed_by and reviewed_at; Acre ICMS 19 percent now cites the primary source https://www.legis.ac.gov.br/detalhar/5461 (LC/AC 422/2022, read on 2026-10-28) with the exceptions of art. 18 registered and the unread items listed, and stays not homologated; 0 of 31 rate versions homologated, nothing CONFERIDO. Test cases: 57 planned, 48 executed and approved (84.2 percent), 9 depend on people, devices, authorization or a definition. pytest 533 passed and the same 8 earlier unrelated failures, web 218 of 218, build ok. Recommendation: conditioned functional approval, Simulador limited to manually informed hypotheses until the indicators are CONFERIDO and the rates are homologated by a named reviewer. Evidence: evidence/ops/simulador-homologacao-20261028.txt, docs/homologacao/SIMULADOR-RELATORIO-FINAL.md. Published to production on 2026-10-28 by explicit user authorization (push and publish): API 0.3.125 (sirta-prod-api:31, migrations 0109, 0110 and 0111 applied at start) and web 0.4.24 (sirta-prod-web:32), evidence/ops/prod-simulador-0.4.24-20261028.txt; rollback web to :31, but the API cannot return to :30 without first running alembic downgrade 0108_sped_operations in an authorized one-off task. Owner decisions of 2026-10-28: Quantidade NF-e is defined as the number of items (not confirmed by SPED, nothing promoted to CONFERIDO) and the ICMS rates of all UFs plus ITCD, ITBI and ISS stand as they are only as Simulador parameters (not homologated). Authenticated checks of the live API are still to be done by an operator with login. 