evidence: evidence/releases/0.4.0/ui/
next_action: "Tax Better is the active scope in docs/product/TAX-BETTER.md, roadmap 1.3. The shell opens Integração, Visão and Administração only after a successful operator login with username and password. The public bootstrap session no longer opens the interface. Administração lists users, roles, territories and purposes for the technical administrator. Passwords are stored only as a hash. By decision of 2026-10-22 the operator login of the technical administrator also reads Integração, Visão and the published panels; sessions without that login keep the technical administrator out of fiscal content, and validation, collection and debt proposals stay with their own roles. Published panels stay under Referência publicada. The sources tool stores the file or API channel and the field map for TAX-BETTER-ENTRADA. A live organ fetch stays blocked until the act. Next delivery, when an authorized file exists, is the vehicle ICMS rule from DETRAN plus FIPE, with human approval before any malha export. Gates unchanged. No merge. Frontend BI overhaul (design system Meridiano, interactive Visão geral, step-based Integração, Administração with side panel, lazy routes, docs/product/FRONTEND-DESIGN-SYSTEM.md)  is published as web 0.4.20 (task definition sirta-prod-web:28, evidence/ops/prod-frontend-bi-20261027.txt). Source SPED-NFE-UF-CFOP (public aggregated SPED NF-e by UF, CFOP and year 2021-2025, R$ is an estimated allocation, exploratory, not homologated, never summed across operations) is loaded once in prod under explicit authorization: API 0.3.124 (sirta-prod-api:30, migration 0108), web 0.4.22 (sirta-prod-web:30), run d25c890e-f93c-4b64-b307-247d64799e3f, sha256 1091967dd768b72152cc4c4a9b01b8637eebe45827c268f658ad462044e02cf3, 945 series rows and 46825 base facts, panel /sped-operacoes under Referência publicada, evidence/ops/prod-sped-ingest-20261027.txt. Open finding: UF labels in the source workbook look swapped (AC and RR carry volumes that belong to larger UFs); conferir with the primary SPED source before any use. Local, not yet published (web 0.4.23 pending authorization): menu Simulador above Visão geral with route /simulador (Part A public quantity, estimated value and simulated tax by UF and operation; Part B desired quantity and value compared with a public year and the tax difference; ITCD 6%, ITBI 3%, ISS 5% and ICMS modal rate by UF from the annex supplied by the user, AC read as 19% and to be confirmed; municipality and goods type are not available in the public data and are only informational), SPED panel isolates the selected UF hexagon and shows quantity and estimated value as two lines in one chart (separate axes or index 100), evidence/ops/simulador-*-preview-20261027.png (synthetic preview data only). Second adjustment, local and not published: labels say only 'Valor' (no per-panel 'Estimado' badge; the exploratory banner and the 'Como o valor é calculado' section stay), the SPED panel has one single UF hexagon map with quantity and value in each hexagon and a 'Colorir por Quantidade | Valor' selector, the Simulador shows the public data and tax first and the quantity and value fields right after (no 'Parte A/B' text), the fields work without a SPED load, and the unused Município selector was removed, and the SPED panel has a button 'Simular com esta UF e operação' that opens /simulador?uf=..&operacao=.. (URL values are whitelisted). Evidence in evidence/ops/simulador-sped-ajustes2-20261027.txt. Published to production as web 0.4.23 (sirta-prod-web:31, rollback to :30) on 2026-10-27, evidence/ops/prod-web-0.4.23-20261027.txt. SPED source check of 2026-10-27 (local, not published): the workbook repeats the official history cell by cell, but the two official SPED publications disagree by CFOP and by inbound/outbound although they share the same grand total, and neither defines Quantidade NF-e; quantity by UF and CFOP and the allocated value are NAO_CONFIAVEL, nothing is CONFERIDO, homologation stays blocked until SPED clarifies (docs/data/SPED-CONFIABILIDADE.md, evidence/ops/sped-reconciliacao-20261028.md). Versioned tax rates: migration 0109_tax_rate_versions and GET /v1/tax-rates, only the Acre ICMS modal rate is VALIDADO (17% to 2023-03-31, 19% from 2023-04-01, LC/AC 422/2022, official URL still to attach), the other 26 UFs and ITCD/ITBI/ISS are PENDENTE; the Simulador uses the rate in force each year and shows its status. Not applied to production; publishing the API would apply 0109 at start. Evidence in evidence/ops/sped-icms-versionado-20261027.txt. Reliability control and Simulador hypotheses (2026-10-28, local, not published, no deploy): config/indicator-reliability.yaml with NAO_CONFIAVEL, EXPLORATORIO and CONFERIDO (fail closed, nothing CONFERIDO); API additive reliability block and GET /v1/indicator-reliability/{id}/fiscal-use returning 409 for anything not CONFERIDO; the Simulador reads no public data and shows only the manually informed hypothesis while a required indicator is not CONFERIDO, with the public comparison disabled; rate versions carry homologated and homologationGaps (0 of 31 homologated, an image is not a legal basis). Audit of the 1041 omitted UF x CFOP x year cells (268317945 NF-e, all Compras by the published rule, CFOPs 1.15x, 1.190, 2.15x, 2.170, no published exclusion rule explains them, 10.9 percent of the Compras in the workbook): evidence/ops/sped-auditoria-omissoes-20261028.md and the csv. The two official originals are versioned in docs/data/originais and checked by tools/ops/sped-source-verify.py. Report: docs/delivery/RELATORIO-SIMULADOR-SIRTA-20261028.md. Transfers, Acre ICMS and rates by locality (2026-10-28, local, not published, no deploy, no ingestion): migration 0110_direction_rate_scope adds sped_operation_facts.direcao (RECEBIDA or REMETIDA, existing transfer rows are REMETIDA) and, on tax_rate_versions, jurisdiction_level (UF, MUNICIPIO, SIMULACAO), municipality_ibge_code, operation_ref, reference_min and reference_max, h