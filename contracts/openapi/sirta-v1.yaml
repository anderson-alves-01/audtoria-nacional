openapi: 3.1.0
info:
  title: SIRTA Municipal API
  version: 0.3.0
  description: >
    Active OpenAPI source of truth for SIRTA. implementation_version 0.3.36
    serves official PUBLIC_OPEN Gold pending human validation on the 0.3.0 specification.
    Roadmap stage OFFICIAL_DATA_WAVE_1_COMPLETE_ROADMAP_IN_PROGRESS.
    ISR and transfer writes remain specified and are not served until later local slices.
    Sensitive operations require OIDC plus tenant, territory and purpose context.
servers:
  - url: http://localhost:8080
security:
  - oidc: []
paths:
  /health:
    get:
      operationId: health
      security: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthStatus'}
  /ready:
    get:
      operationId: ready
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthStatus'}
        '503':
          description: Database unavailable
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/tax-credits:
    get:
      operationId: listTaxCredits
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
      responses:
        '200':
          description: Authorized page of tax credits
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaxCreditPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createTaxCredit
      parameters:
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTaxCredit'}
      responses:
        '201':
          description: Identified credit created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaxCredit'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
  /v1/tax-credits/{creditId}:
    get:
      operationId: getTaxCredit
      parameters:
        - {$ref: '#/components/parameters/CreditId'}
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
      responses:
        '200':
          description: Tax credit
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaxCredit'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/tax-credits/{creditId}/validations:
    post:
      operationId: validateTaxCredit
      description: >
        Validator records APPROVE, REJECT or REQUEST_INFORMATION. Invalid
        transitions return 409 and leave the credit unchanged. Collection is
        not started by this operation.
      parameters:
        - {$ref: '#/components/parameters/CreditId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ValidationDecision'}
      responses:
        '200':
          description: Validation recorded
          content:
            application/json:
              schema: {$ref: '#/components/schemas/ValidationOutcome'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
  /v1/tax-credits/{creditId}/collection-cases:
    post:
      operationId: startAdministrativeCollection
      description: >
        Collector starts administrative collection only when the credit is
        VALIDATED and ENFORCEABLE. Unvalidated or blocked credits return 409
        without state change.
      parameters:
        - {$ref: '#/components/parameters/CreditId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
      responses:
        '201':
          description: Collection case created after all gates
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CollectionCase'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
  /v1/collection-cases:
    get:
      operationId: listCollectionCases
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
      responses:
        '200':
          description: Authorized collection cases
          content:
            application/json:
              schema: {$ref: '#/components/schemas/CollectionCasePage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/tax-credits/{creditId}/payments:
    post:
      operationId: registerReconciledPayment
      description: Collector records a recovered payment only after reconciliation.
      parameters:
        - {$ref: '#/components/parameters/CreditId'}
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reconciliationRef]
              properties:
                reconciliationRef: {type: string, minLength: 3}
      responses:
        '200': {description: Payment recovered}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/tax-credits/{creditId}/installments:
    post:
      operationId: startInstallment
      parameters:
        - {$ref: '#/components/parameters/CreditId'}
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
      responses:
        '200': {description: Installment current}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/tax-credits/{creditId}/active-debt-proposals:
    post:
      operationId: proposeActiveDebt
      parameters:
        - {$ref: '#/components/parameters/CreditId'}
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
      responses:
        '200': {description: Collection moved to ACTIVE_DEBT}
        '409': {$ref: '#/components/responses/Conflict'}
  /v1/transfer-occurrences:
    get:
      operationId: listTransferOccurrences
      description: Synthetic transfer occurrences. Never tax credits.
      parameters:
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
      responses:
        '200': {description: Authorized transfer occurrences}
    post:
      operationId: createTransferOccurrence
      description: Synthetic transfer occurrence. Never creates a tax credit.
      parameters:
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TransferOccurrenceInput'}
      responses:
        '201': {description: Occurrence created; no tax credit is generated}
  /v1/data-loads/synthetic-iss:
    post:
      operationId: runSyntheticIssLoad
      description: Local synthetic ISS Bronze/Silver/Gold load. Never creates a tax credit.
      parameters:
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
        - name: dry_run
          in: query
          schema: {type: boolean, default: false}
      responses:
        '200': {description: Load accepted or replayed}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/indicators/credit-funnel:
    get:
      operationId: getCreditFunnel
      description: Published synthetic counts. Regional R$ hypotheses are not included.
      parameters:
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
      responses:
        '200': {description: Funnel counts with methodology version}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/indicators/source-enrichment:
    get:
      operationId: getSourceEnrichment
      description: Published official Gold enrichment. Public sources never create tax credits.
      parameters:
        - name: sourceId
          in: query
          required: true
          schema: {type: string}
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
      responses:
        '200': {description: Enrichment counts; createsTaxCredit=false}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/regulatory/ibs-cbs:
    get:
      operationId: getIbsCbsCalendar
      description: >
        Non-binding IBS/CBS regulatory calendar (catalog-official-docs-v1).
        Links preservedDocuments to Gold PLANALTO-LEGISLACAO and PLANALTO-LC-214
        when published. Items remain NON_BINDING; operational=false; homologated=false.
      parameters:
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
      responses:
        '200': {description: Non-binding catalog; preservedDocuments; operational=false}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/diagnosis:
    get:
      operationId: getMunicipalDiagnosis
      description: >
        Technical municipal diagnosis shell. Checklist unmet; recoveryMeta=null;
        no recovery target. G1 remains BLOCKED. commandsDisabled=true.
      parameters:
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
      responses:
        '200': {description: Empty technical diagnosis; recoveryMeta=null}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/audit-rules:
    get:
      operationId: listAuditRules
      description: >
        Non-binding audit rule catalog. binding=false; createsTaxCredit=false;
        taxPotentialAsCredit=false. G4 homologation absent.
      parameters:
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
      responses:
        '200': {description: Non-binding rule placeholders; commandsDisabled}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/findings:
    get:
      operationId: listFindings
      description: >
        Technical audit findings shell. Empty items; commandsDisabled=true;
        createsTaxCredit=false; legalCommandsEnabled=false. G5 BLOCKED.
      parameters:
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200': {description: Empty findings page; no tax credit}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/cases:
    get:
      operationId: listAuditCases
      description: >
        Technical audit cases shell (D5). Distinct from collection-cases.
        Empty items; create disabled until G4/G5.
      parameters:
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200': {description: Empty audit cases page; commandsDisabled}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createAuditCase
      description: >
        Always rejected (409). Technical shell does not persist cases or create credits.
      parameters:
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
      responses:
        '409': {description: Commands disabled; no persistence}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/human-validation:
    get:
      operationId: getHumanValidationWorkflow
      description: >
        Human validation workflow shell (F5). Reference states only; queue empty;
        publishesPublicCredit=false. Not Gold homologation; not credit validation.
      parameters:
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
      responses:
        '200': {description: Empty workflow; commandsDisabled; G4/G5 BLOCKED}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/notifications:
    get:
      operationId: listNotifications
      description: >
        Administrative notifications shell. Empty items; sendEnabled=false;
        real delivery disabled until human approval.
      parameters:
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200': {description: Empty notifications page; send disabled}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: sendNotification
      description: >
        Always rejected (409). Technical shell never sends or persists notifications.
      parameters:
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
      responses:
        '409': {description: Send disabled; no delivery}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/collection:
    get:
      operationId: getCollectionPanel
      description: >
        Official empty administrative collection panel. commandsDisabled=true;
        synthetic start remains API-test only via tax-credit collection-cases.
      parameters:
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
      responses:
        '200': {description: Empty collection panel; G0/G4/G5 BLOCKED}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/payments:
    get:
      operationId: getPaymentsPanel
      description: >
        Official empty payments and installments panel. recoveryInvented=false;
        commands disabled until municipal credential and G0/G5/G6.
      parameters:
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200': {description: Empty payments panel; CREDENTIAL_REQUIRED}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: commandPaymentsPanel
      description: Always rejected (409). No payment, installment or invented recovery.
      parameters:
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
      responses:
        '409': {description: Commands disabled; no payment recorded}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/active-debt:
    get:
      operationId: getActiveDebtPanel
      description: >
        Official empty active-debt panel. inscriptionEnabled=false;
        no legal inscription until municipal authorization and G0/G5/G6.
      parameters:
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
      responses:
        '200': {description: Empty active-debt panel; inscription disabled}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: inscribeActiveDebt
      description: Always rejected (409). Technical shell never inscribes active debt.
      parameters:
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
      responses:
        '409': {description: Inscription disabled; no certidão}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/procuradoria:
    get:
      operationId: getProcuradoriaPanel
      description: >
        Official empty Procuradoria workflow. altersLegalStatus=false;
        no automatic legal status change.
      parameters:
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
      responses:
        '200': {description: Empty Procuradoria workflow; legal commands disabled}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: commandProcuradoria
      description: Always rejected (409). No automatic legal forwarding or status change.
      parameters:
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
      responses:
        '409': {description: Legal commands disabled}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/transfer-reconciliation:
    get:
      operationId: getTransferReconciliation
      description: >
        Empty transfer reconciliation shell. Compares expected versus received only
        when both exist. Differences are occurrences, never tax credits. G7 official blocked.
      parameters:
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200': {description: Empty reconciliation panel; createsTaxCredit=false}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: commandTransferReconciliation
      description: Always rejected (409). No automatic reconciliation or credit creation.
      parameters:
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
      responses:
        '409': {description: Reconciliation commands disabled}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/pilot-readiness:
    get:
      operationId: getPilotReadiness
      description: >
        Technical pilot readiness checklist. Technical items may be met; G9 remains
        BLOCKED without municipality, users and institutional acceptances.
      parameters:
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
      responses:
        '200': {description: Technical checklist; institutionalReady=false; G9 BLOCKED}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/ops-governance:
    get:
      operationId: getOpsGovernance
      description: >
        Local ops and governance readiness with runbook inventory. canDeploy=false;
        terraformApplyAuthorized=false; G10 BLOCKED. No fabricated human approval.
      parameters:
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
      responses:
        '200': {description: Local runbooks listed; G10 BLOCKED}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/municipal-uploads:
    get:
      operationId: getMunicipalUploads
      description: >
        Controlled municipal restricted upload shell. Schemas and quarantine slots
        listed; uploadEnabled=false; no municipal samples until DPA and G0.
      parameters:
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200': {description: Empty upload slots; CREDENTIAL_REQUIRED}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: commandMunicipalUploads
      description: Always rejected (409). No municipal file accepted without DPA/G0.
      parameters:
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
      responses:
        '409': {description: Upload disabled; no sample accepted}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/cadastro-360:
    get:
      operationId: getCadastro360
      description: >
        Cadastro 360 technical empty shell. No real PII, no invented territory,
        minimization enforced. CREDENTIAL_REQUIRED until territorial scope and G0.
      parameters:
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200': {description: Empty subjects; piiPresent=false}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: commandCadastro360
      description: Always rejected (409). No subject enrichment without authorization.
      parameters:
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
      responses:
        '409': {description: Commands disabled; no PII enrichment}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/sectoral-enrichment:
    get:
      operationId: getSectoralEnrichment
      description: >
        Sectoral REFERENCE_ENRICHMENT empty shell for ANP, ANEEL, EPE, Anatel,
        BCB and CNES. Cataloged endpoints; partial UF-scoped ingest when
        TECHNICALLY_APPROVED; no tax credit.
      parameters:
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200': {description: Empty sectoral shell; DISCOVERED sources listed}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: commandSectoralEnrichment
      description: Always rejected (409). No sectoral load without technical activation.
      parameters:
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
      responses:
        '409': {description: Commands disabled; no sectoral ingest}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/state-transfers:
    get:
      operationId: getStateTransfers
      description: >
        State ICMS/IPVA catalog. PE may be TECHNICALLY_APPROVED with ingestAllowed;
        createsTaxCredit=false; commandsDisabled; BA/MG/RJ without activated load.
      parameters:
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200': {description: Empty state-transfers shell with per-UF status}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: commandStateTransfers
      description: Always rejected (409). No state ICMS/IPVA load without schema activation.
      parameters:
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
      responses:
        '409': {description: Commands disabled; no state transfer ingest}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/data-sources:
    get:
      operationId: listDataSources
      description: Official master source registry. Public sources never create tax credits.
      parameters:
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
      responses:
        '200': {description: Catalog items with ingestAllowed and createsTaxCredit=false}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/data-sources/{sourceId}/dry-run:
    post:
      operationId: dryRunDataSource
      description: Dry-run of a cataloged source. Official sources report the planned official URL.
      parameters:
        - name: sourceId
          in: path
          required: true
          schema: {type: string}
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
      responses:
        '200': {description: Dry-run accepted for an allowed catalog source}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/data-sources/{sourceId}/ingest:
    post:
      operationId: ingestCatalogSource
      description: >
        Catalog-driven official ingest for PUBLIC_OPEN sources. Preserves landing checksum,
        quarantines invalid rows and never creates a tax credit. Synthetic fixtures are test-only.
      parameters:
        - name: sourceId
          in: path
          required: true
          schema: {type: string}
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
      responses:
        '200': {description: Ingest accepted or replayed; taxCreditCreated=false}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/indicators/official-gold:
    get:
      operationId: getOfficialGold
      description: >
        Official Gold indicators derived from Silver. Homologation remains
        REAL_OFFICIAL_DATA_PENDING_HUMAN_VALIDATION. Empty sources are listed, never simulated.
      parameters:
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
      responses:
        '200': {description: Official Gold items or empty sources with reason}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/indicators/official-gold/lines:
    get:
      operationId: getOfficialGoldLines
      description: >
        Per-row Gold lineage to Silver, Bronze checksum, landing manifest and official URL.
        Incomplete lineage is rejected.
      parameters:
        - name: sourceId
          in: query
          schema: {type: string}
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
      responses:
        '200': {description: Gold lines with complete lineage}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/dashboards:
    get:
      operationId: listDashboards
      description: Fifteen official dashboards. Empty modules stay empty. No synthetic fill. Commands disabled.
      parameters:
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
      responses:
        '200': {description: Dashboard catalog with official Gold subsets}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/dashboards/{dashboardId}:
    get:
      operationId: getDashboard
      description: One official dashboard. ROI is never calculated without eligible received values.
      parameters:
        - name: dashboardId
          in: path
          required: true
          schema: {type: string}
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
      responses:
        '200': {description: Dashboard view}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/program-gates:
    get:
      operationId: listProgramGates
      description: Local/official gate snapshot with unmet G0/G1 checklists. Human approvals are never fabricated.
      parameters:
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
      responses:
        '200': {description: Flags disabled; G0/G1/G4/G9/G10 BLOCKED}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
  /v1/indicators/sirta-recovery-index:
    get:
      operationId: getSirtaRecoveryIndex
      description: Not implemented. Regional R$ hypotheses are not KPIs.
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}}
      responses:
        '200':
          description: "ISR with numerator, denominator, exclusions and policy version"
  /v1/audit-events:
    get:
      operationId: listAuditEvents
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
      responses:
        '200':
          description: Authorized audit page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditEventPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: http://localhost:8081/realms/sirta/.well-known/openid-configuration
  parameters:
    CreditId:
      name: creditId
      in: path
      required: true
      schema: {type: string, format: uuid}
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 0, default: 0}
    PageSize:
      name: size
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 128}
    TerritoryId:
      name: X-Territory-Id
      in: header
      required: true
      schema: {type: string, format: uuid}
    PurposeId:
      name: X-Purpose-Id
      in: header
      required: true
      schema: {type: string, format: uuid}
  schemas:
    HealthStatus:
      type: object
      required: [status, specVersion, implementationVersion, releaseStage]
      properties:
        status: {type: string}
        specVersion: {type: string}
        implementationVersion: {type: string}
        releaseStage: {type: string}
    CreateTaxCredit:
      type: object
      required:
        - tenantId
        - territoryId
        - purposeId
        - taxpayerId
        - taxType
        - competence
        - sourceId
        - principalAmount
        - calculationMemory
        - enforceabilityStatus
        - evidenceIds
      properties:
        tenantId: {type: string, format: uuid}
        territoryId: {type: string, format: uuid}
        purposeId: {type: string, format: uuid}
        taxpayerId: {type: string, format: uuid}
        taxType: {type: string, enum: [ISS, IPTU, ITBI, FEE, IRRF, OTHER]}
        competence: {type: string, pattern: '^[0-9]{4}(-[0-9]{2})?$'}
        sourceId: {type: string, description: Official origin of the credit}
        principalAmount: {type: number, minimum: 0}
        additionalAmount: {type: number, minimum: 0}
        currency: {type: string, default: BRL}
        calculationMemory: {type: string, minLength: 10}
        enforceabilityStatus:
          type: string
          enum: [ENFORCEABLE, SUSPENDED, EXTINGUISHED, BLOCKED, LEGAL_REVIEW]
        evidenceIds:
          type: array
          minItems: 1
          items: {type: string, format: uuid}
    TaxCredit:
      allOf:
        - {$ref: '#/components/schemas/CreateTaxCredit'}
        - type: object
          required: [id, validationStatus, collectionStatus, paymentStatus, version]
          properties:
            id: {type: string, format: uuid}
            validationStatus:
              type: string
              enum: [IDENTIFIED, UNDER_REVIEW, VALIDATED, REJECTED, CANCELLED]
            collectionStatus:
              type: string
              enum: [NOT_STARTED, ADMINISTRATIVE, ACTIVE_DEBT, LEGAL_COUNSEL, JUDICIAL, CLOSED]
            paymentStatus:
              type: string
              enum: [OPEN, PARTIAL, PAID, COMPENSATED, INSTALLMENT_CURRENT, INSTALLMENT_BREACHED]
            version: {type: integer, minimum: 0}
    TaxCreditPage:
      type: object
      required: [items, page, size]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/TaxCredit'}
        page: {type: integer}
        size: {type: integer}
    AuditEvent:
      type: object
      required: [id, occurredAt, tenantId, actorId, action, route, outcome]
      properties:
        id: {type: string, format: uuid}
        occurredAt: {type: string, format: date-time}
        tenantId: {type: string, format: uuid}
        actorId: {type: string, format: uuid}
        action: {type: string}
        route: {type: string}
        outcome: {type: string}
        resourceType: {type: [string, 'null']}
        resourceId: {type: [string, 'null'], format: uuid}
    AuditEventPage:
      type: object
      required: [items, page, size]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AuditEvent'}
        page: {type: integer}
        size: {type: integer}
    ValidationDecision:
      type: object
      required: [decision, checklistVersion, evidenceIds, rationale, checklistItems]
      properties:
        decision: {type: string, enum: [APPROVE, REJECT, REQUEST_INFORMATION]}
        checklistVersion: {type: string, example: credit-legality-v1}
        evidenceIds: {type: array, minItems: 1, items: {type: string, format: uuid}}
        rationale: {type: string, minLength: 10}
        checklistItems:
          type: array
          items: {$ref: '#/components/schemas/ChecklistItem'}
    ChecklistItem:
      type: object
      required: [code, satisfied]
      properties:
        code: {type: string}
        satisfied: {type: boolean}
    ValidationOutcome:
      allOf:
        - {$ref: '#/components/schemas/TaxCredit'}
        - type: object
          required: [validationId, decision]
          properties:
            validationId: {type: string, format: uuid}
            decision: {type: string, enum: [APPROVE, REJECT, REQUEST_INFORMATION]}
    CollectionCase:
      type: object
      required: [id, creditId, status, slaDueAt, openedAt, timeline, version]
      properties:
        id: {type: string, format: uuid}
        creditId: {type: string, format: uuid}
        status: {type: string, enum: [ADMINISTRATIVE, ACTIVE_DEBT, LEGAL_COUNSEL, JUDICIAL, CLOSED]}
        collectionStatus: {type: string}
        validationStatus: {type: string}
        slaDueAt: {type: string, format: date-time}
        openedAt: {type: string, format: date-time}
        timeline: {type: array, items: {type: object, additionalProperties: true}}
        version: {type: integer}
    CollectionCasePage:
      type: object
      required: [items, page, size]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/CollectionCase'}
        page: {type: integer}
        size: {type: integer}
    TransferOccurrenceInput:
      type: object
      required: [transferType, competence, officialSource, receivedAmount]
      properties:
        transferType: {type: string, enum: [FPM, ICMS_SHARE, IPVA_SHARE, ITR, IPI_EXPORT, CIDE, FUNDEB, ROYALTY, OTHER]}
        competence: {type: string}
        officialSource: {type: string}
        expectedAmount: {type: [number, 'null'], minimum: 0}
        receivedAmount: {type: number, minimum: 0}
    Problem:
      type: object
      required: [type, title, status, traceId]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        traceId: {type: string}
  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Forbidden:
      description: Missing role, tenant, territory or valid access purpose
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: Resource not found or not visible in the current context
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Conflict:
      description: Invalid or concurrent credit transition
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ValidationProblem:
      description: Semantic validation failed
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
