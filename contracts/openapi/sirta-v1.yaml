openapi: 3.1.0
info:
  title: SIRTA Municipal API
  version: 0.3.0
  description: Contract-first API. Sensitive operations require tenant, territory and purpose context supplied by authenticated claims and policy middleware.
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      operationId: health
      responses:
        '200': {description: Healthy}
  /v1/tax-credits:
    get:
      operationId: listTaxCredits
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
      responses:
        '200': {description: Authorized page of tax credits}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createTaxCredit
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTaxCredit'}
      responses:
        '201': {description: Identified credit created}
        '422': {$ref: '#/components/responses/ValidationProblem'}
  /v1/tax-credits/{creditId}:
    get:
      operationId: getTaxCredit
      parameters:
        - {$ref: '#/components/parameters/CreditId'}
      responses:
        '200': {description: Tax credit}
        '404': {description: Not found or not visible}
  /v1/tax-credits/{creditId}/validations:
    post:
      operationId: validateTaxCredit
      parameters:
        - {$ref: '#/components/parameters/CreditId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ValidationDecision'}
      responses:
        '200': {description: Validation recorded}
        '409': {description: Invalid or concurrent transition}
        '422': {$ref: '#/components/responses/ValidationProblem'}
  /v1/tax-credits/{creditId}/collection-cases:
    post:
      operationId: startAdministrativeCollection
      parameters:
        - {$ref: '#/components/parameters/CreditId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '201': {description: Collection case created after all gates}
        '409': {description: Credit state blocks collection}
        '422': {$ref: '#/components/responses/ValidationProblem'}
  /v1/transfer-occurrences:
    get:
      operationId: listTransferOccurrences
      responses:
        '200': {description: Authorized transfer occurrences}
    post:
      operationId: createTransferOccurrence
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TransferOccurrenceInput'}
      responses:
        '201': {description: Occurrence created; no tax credit is generated}
  /v1/indicators/sirta-recovery-index:
    get:
      operationId: getSirtaRecoveryIndex
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}}
      responses:
        '200': {description: ISR with numerator, denominator, exclusions and policy version}
  /v1/audit-events:
    get:
      operationId: listAuditEvents
      responses:
        '200': {description: Authorized audit page}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  parameters:
    CreditId:
      name: creditId
      in: path
      required: true
      schema: {type: string, format: uuid}
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 0, default: 0}
    PageSize:
      name: size
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 128}
  schemas:
    CreateTaxCredit:
      type: object
      required: [taxpayerId, taxType, competence, sourceId, principalAmount]
      properties:
        taxpayerId: {type: string, format: uuid}
        taxType: {type: string, enum: [ISS, IPTU, ITBI, FEE, IRRF, OTHER]}
        competence: {type: string}
        sourceId: {type: string}
        principalAmount: {type: number, minimum: 0}
    ValidationDecision:
      type: object
      required: [decision, checklistVersion, evidenceIds, rationale]
      properties:
        decision: {type: string, enum: [APPROVE, REJECT, REQUEST_INFORMATION]}
        checklistVersion: {type: string}
        evidenceIds: {type: array, minItems: 1, items: {type: string, format: uuid}}
        rationale: {type: string, minLength: 10}
    TransferOccurrenceInput:
      type: object
      required: [transferType, competence, officialSource, receivedAmount]
      properties:
        transferType: {type: string, enum: [FPM, ICMS_SHARE, IPVA_SHARE, ITR, IPI_EXPORT, CIDE, FUNDEB, ROYALTY, OTHER]}
        competence: {type: string}
        officialSource: {type: string}
        expectedAmount: {type: [number, 'null'], minimum: 0}
        receivedAmount: {type: number, minimum: 0}
    Problem:
      type: object
      required: [type, title, status, traceId]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        traceId: {type: string}
  responses:
    Forbidden:
      description: Missing role, tenant, territory or valid access purpose
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ValidationProblem:
      description: Semantic validation failed
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}

