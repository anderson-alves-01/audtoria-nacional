openapi: 3.1.0
info:
  title: SIRTA Municipal API
  version: 0.3.0
  description: >
    Active OpenAPI source of truth for SIRTA. implementation_version 0.3.1
    implements F0 foundation only. ValidateCredit, collection, ISR and
    transfer writes are specified for later sprints and are not served in F0.
    Sensitive operations require OIDC plus tenant, territory and purpose context.
servers:
  - url: http://localhost:8080
security:
  - oidc: []
paths:
  /health:
    get:
      operationId: health
      security: []
      responses:
        '200':
          description: Healthy
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthStatus'}
  /ready:
    get:
      operationId: ready
      security: []
      responses:
        '200':
          description: Ready
          content:
            application/json:
              schema: {$ref: '#/components/schemas/HealthStatus'}
        '503':
          description: Database unavailable
          content:
            application/problem+json:
              schema: {$ref: '#/components/schemas/Problem'}
  /v1/tax-credits:
    get:
      operationId: listTaxCredits
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
      responses:
        '200':
          description: Authorized page of tax credits
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaxCreditPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
    post:
      operationId: createTaxCredit
      parameters:
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/CreateTaxCredit'}
      responses:
        '201':
          description: Identified credit created
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaxCredit'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '422': {$ref: '#/components/responses/ValidationProblem'}
  /v1/tax-credits/{creditId}:
    get:
      operationId: getTaxCredit
      parameters:
        - {$ref: '#/components/parameters/CreditId'}
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
      responses:
        '200':
          description: Tax credit
          content:
            application/json:
              schema: {$ref: '#/components/schemas/TaxCredit'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
  /v1/tax-credits/{creditId}/validations:
    post:
      operationId: validateTaxCredit
      description: Not implemented in F0. Specified for Sprint 2.
      parameters:
        - {$ref: '#/components/parameters/CreditId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/ValidationDecision'}
      responses:
        '200': {description: Validation recorded}
        '409': {description: Invalid or concurrent transition}
        '422': {$ref: '#/components/responses/ValidationProblem'}
  /v1/tax-credits/{creditId}/collection-cases:
    post:
      operationId: startAdministrativeCollection
      description: Not implemented in F0. Specified for Sprint 3.
      parameters:
        - {$ref: '#/components/parameters/CreditId'}
        - {$ref: '#/components/parameters/IdempotencyKey'}
      responses:
        '201': {description: Collection case created after all gates}
        '409': {description: Credit state blocks collection}
        '422': {$ref: '#/components/responses/ValidationProblem'}
  /v1/transfer-occurrences:
    get:
      operationId: listTransferOccurrences
      description: Not implemented in F0.
      responses:
        '200': {description: Authorized transfer occurrences}
    post:
      operationId: createTransferOccurrence
      description: Not implemented in F0. A transfer never creates a tax credit.
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/TransferOccurrenceInput'}
      responses:
        '201': {description: Occurrence created; no tax credit is generated}
  /v1/indicators/sirta-recovery-index:
    get:
      operationId: getSirtaRecoveryIndex
      description: Not implemented in F0. Regional R$ hypotheses are not KPIs.
      parameters:
        - {name: from, in: query, required: true, schema: {type: string, format: date}}
        - {name: to, in: query, required: true, schema: {type: string, format: date}}
      responses:
        '200':
          description: "ISR with numerator, denominator, exclusions and policy version"
  /v1/audit-events:
    get:
      operationId: listAuditEvents
      parameters:
        - {$ref: '#/components/parameters/Page'}
        - {$ref: '#/components/parameters/PageSize'}
        - {$ref: '#/components/parameters/TerritoryId'}
        - {$ref: '#/components/parameters/PurposeId'}
      responses:
        '200':
          description: Authorized audit page
          content:
            application/json:
              schema: {$ref: '#/components/schemas/AuditEventPage'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
components:
  securitySchemes:
    oidc:
      type: openIdConnect
      openIdConnectUrl: http://localhost:8081/realms/sirta/.well-known/openid-configuration
  parameters:
    CreditId:
      name: creditId
      in: path
      required: true
      schema: {type: string, format: uuid}
    Page:
      name: page
      in: query
      schema: {type: integer, minimum: 0, default: 0}
    PageSize:
      name: size
      in: query
      schema: {type: integer, minimum: 1, maximum: 100, default: 20}
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema: {type: string, minLength: 16, maxLength: 128}
    TerritoryId:
      name: X-Territory-Id
      in: header
      required: true
      schema: {type: string, format: uuid}
    PurposeId:
      name: X-Purpose-Id
      in: header
      required: true
      schema: {type: string, format: uuid}
  schemas:
    HealthStatus:
      type: object
      required: [status, specVersion, implementationVersion, releaseStage]
      properties:
        status: {type: string}
        specVersion: {type: string}
        implementationVersion: {type: string}
        releaseStage: {type: string}
    CreateTaxCredit:
      type: object
      required:
        - tenantId
        - territoryId
        - purposeId
        - taxpayerId
        - taxType
        - competence
        - sourceId
        - principalAmount
        - calculationMemory
        - enforceabilityStatus
        - evidenceIds
      properties:
        tenantId: {type: string, format: uuid}
        territoryId: {type: string, format: uuid}
        purposeId: {type: string, format: uuid}
        taxpayerId: {type: string, format: uuid}
        taxType: {type: string, enum: [ISS, IPTU, ITBI, FEE, IRRF, OTHER]}
        competence: {type: string, pattern: '^[0-9]{4}(-[0-9]{2})?$'}
        sourceId: {type: string, description: Official origin of the credit}
        principalAmount: {type: number, minimum: 0}
        additionalAmount: {type: number, minimum: 0}
        currency: {type: string, default: BRL}
        calculationMemory: {type: string, minLength: 10}
        enforceabilityStatus:
          type: string
          enum: [ENFORCEABLE, SUSPENDED, EXTINGUISHED, BLOCKED, LEGAL_REVIEW]
        evidenceIds:
          type: array
          minItems: 1
          items: {type: string, format: uuid}
    TaxCredit:
      allOf:
        - {$ref: '#/components/schemas/CreateTaxCredit'}
        - type: object
          required: [id, validationStatus, collectionStatus, paymentStatus, version]
          properties:
            id: {type: string, format: uuid}
            validationStatus:
              type: string
              enum: [IDENTIFIED, UNDER_REVIEW, VALIDATED, REJECTED, CANCELLED]
            collectionStatus:
              type: string
              enum: [NOT_STARTED, ADMINISTRATIVE, ACTIVE_DEBT, LEGAL_COUNSEL, JUDICIAL, CLOSED]
            paymentStatus:
              type: string
              enum: [OPEN, PARTIAL, PAID, COMPENSATED, INSTALLMENT_CURRENT, INSTALLMENT_BREACHED]
            version: {type: integer, minimum: 0}
    TaxCreditPage:
      type: object
      required: [items, page, size]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/TaxCredit'}
        page: {type: integer}
        size: {type: integer}
    AuditEvent:
      type: object
      required: [id, occurredAt, tenantId, actorId, action, route, outcome]
      properties:
        id: {type: string, format: uuid}
        occurredAt: {type: string, format: date-time}
        tenantId: {type: string, format: uuid}
        actorId: {type: string, format: uuid}
        action: {type: string}
        route: {type: string}
        outcome: {type: string}
        resourceType: {type: [string, 'null']}
        resourceId: {type: [string, 'null'], format: uuid}
    AuditEventPage:
      type: object
      required: [items, page, size]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/AuditEvent'}
        page: {type: integer}
        size: {type: integer}
    ValidationDecision:
      type: object
      required: [decision, checklistVersion, evidenceIds, rationale]
      properties:
        decision: {type: string, enum: [APPROVE, REJECT, REQUEST_INFORMATION]}
        checklistVersion: {type: string}
        evidenceIds: {type: array, minItems: 1, items: {type: string, format: uuid}}
        rationale: {type: string, minLength: 10}
    TransferOccurrenceInput:
      type: object
      required: [transferType, competence, officialSource, receivedAmount]
      properties:
        transferType: {type: string, enum: [FPM, ICMS_SHARE, IPVA_SHARE, ITR, IPI_EXPORT, CIDE, FUNDEB, ROYALTY, OTHER]}
        competence: {type: string}
        officialSource: {type: string}
        expectedAmount: {type: [number, 'null'], minimum: 0}
        receivedAmount: {type: number, minimum: 0}
    Problem:
      type: object
      required: [type, title, status, traceId]
      properties:
        type: {type: string, format: uri-reference}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        traceId: {type: string}
  responses:
    Unauthorized:
      description: Missing or invalid bearer token
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    Forbidden:
      description: Missing role, tenant, territory or valid access purpose
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    NotFound:
      description: Resource not found or not visible in the current context
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
    ValidationProblem:
      description: Semantic validation failed
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
