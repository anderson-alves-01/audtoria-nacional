technical_reference_territory: none
pilot_state_approved: false
adapter: state_transfer_adapter
normalize: ibge7
taxes: [ICMS, IPVA]
notes: >
  PE, BA, MG, ES, GO, MS, RO, AC, CE, RS e AL TECHNICALLY_APPROVED (state_pe_csv /
  state_ba_csv / state_mg_csv / state_es_csv / state_go_csv / state_ms_csv /
  state_ro_csv / state_ac_csv / state_ce_xls / state_rs_xls / state_al_xls).
  MG/ES/AC/AL usam IBGE7 nativo. RO ICMS nome+UF; RO IPVA IBGE6→7. GO IPVA via
  CKAN DataStore dump (CSV upload 500; schema sem ICMS 2026). MS ICMS/IPVA via
  CKAN DataStore mensal (Tipo_Repasse). AC ICMS anual SEPLAG ativado; IPVA
  mensal só via Transparência POST+CSRF (não ativado). CE ICMS/IPVA via XLS
  mensal SEFAZ (Portaria). RS ICMS/IPVA via MontaArquivo XLS mensal SEFAZ
  (TOTAL mês / Total Mês). AL ICMS/IPVA via XLS anual dados.al.gov.br (série
  2015-2021; corrente SEFAZ-AL é PDF semanal). RJ IP-blocked. SC/PR
  PROVENANCE_ONLY (SC SEF CSV ≤2017; PR HTML). Sem agregador privado.
