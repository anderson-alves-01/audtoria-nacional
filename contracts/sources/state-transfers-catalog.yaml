taxes: [ICMS, IPVA]
notes: >
  PE, BA, MG, ES, GO, MS, RO, AC, CE, RS, AL, PI, RN, MA e PR TECHNICALLY_APPROVED
  (state_pe_csv / state_ba_csv / state_mg_csv / state_es_csv / state_go_csv +
  state_go_economia_xlsx / state_ms_csv / state_ro_csv / state_ac_csv+state_ac_transparencia_json /
  state_ce_xls / state_rs_xls / state_al_xls / state_pi_repasseweb_html /
  state_rn_xls / state_ma_xls / state_pr_html).
  PA parcial TECHNICALLY_APPROVED via ICMS Verde SEMAS XLSX
  (state_pa_icms_verde_xlsx; componente ecológico ≤8%, não cota ICMS total).
  Ciclo 0.3.50: ES IPI+CIDE e GO IPI-Exportação ativados nos mesmos arquivos
  PUBLIC_OPEN já usados para ICMS/IPVA (state_es_csv / state_go_economia_xlsx).
  Ciclo 0.3.55: CE/AL/RN IPI ativados nos mesmos arquivos já aprovados
  (state_ce_xls / state_al_xls / state_rn_xls).
  Ciclo 0.3.56: PE/BA/MG IPI ativados nos mesmos arquivos já aprovados
  (state_pe_csv / state_ba_csv / state_mg_csv).
  Ciclo 0.3.57: MA FPEX e PR Fundo de Exportação ativados como IPI-Exportação
  nos mesmos arquivos já aprovados (state_ma_xls / state_pr_html); MS IPI
  EXPORTAÇÃO e CIDE ativados no mesmo DataStore já aprovado (state_ms_csv).
  UFs restantes: RJ IP HTML block; PI ICMS Repasse WEB vazio; SP HTML-per-muni;
  SC CSV ≤2017; RR total sem split ICMS/IPVA; AP 404; MT XLSX ≤2015 / PDF;
  SE/PB PDF; AM HTML-per-município; TO índices PDF.
  MG/ES/AL usam IBGE7 nativo. RO ICMS nome+UF; RO IPVA IBGE6→7. GO IPVA via
  CKAN DataStore dump (CSV upload 500). MS ICMS/IPVA/IPI/CIDE via CKAN DataStore
  mensal. AC ICMS anual SEPLAG; AC IPVA Transparência POST+CSRF JSON.
  CE/RS/AL/RN/MA XLS; PI IPVA Repasse WEB; PR HTML SEFA. Sem agregador privado.
